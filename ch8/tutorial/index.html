<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHD125 · CH8 · Tutorial</title>
<script src="../../js/track.js"></script>
<script src="../../js/brand.js"></script>
<script src="../../js/zoom.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A41;--muted:#56657A;--paper:#F2F6F9;--card:#fff;--line:#D7E0E8;--cold:#2F6F9F;--cold-soft:#E1EEF7;--heat:#B86E00;--heat-soft:#FBEFD9;--ok:#2E7D4F;--ok-soft:#E3F3E9;--bad:#B3261E;--bad-soft:#FBE7E5;color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Lexend,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;font-weight:400}
b,strong{font-weight:600}
.in{max-width:860px;margin:0 auto;padding:0 16px}
header{background:var(--ink);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 0 22px}
header a.home{display:inline-block;color:#fff;text-decoration:none;font-size:.85rem;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:5px 10px;margin-bottom:12px}
header .kick{margin:0;color:#A3B1C2;font-size:.85rem}
header h1{margin:4px 0 4px;font-size:clamp(1.5rem,5.5vw,2.2rem);line-height:1.15}
header .brand{margin:0;color:#F0B24A;font-weight:600;font-size:.9rem}
header .sub{margin:10px 0 0;color:#C9D3DC;font-size:.92rem}
.bar{position:sticky;top:0;z-index:5;background:rgba(242,246,249,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .in{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cold),var(--heat));transition:width .3s}
.bar .n{font-size:.85rem;color:var(--muted);white-space:nowrap}
.btn{font:inherit;font-weight:600;font-size:.92rem;border:0;border-radius:10px;padding:9px 14px;background:var(--cold);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--cold);border:1.5px solid var(--cold)}.btn.warn{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.small{padding:6px 11px;font-size:.85rem}
main{padding:14px 0 40px}
h2{font-size:1.2rem;margin:28px 0 6px}
.secintro{color:var(--muted);margin:0 0 12px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0}
.read{border-left:5px solid var(--cold)}.read h3{margin:0 0 6px;font-size:1.05rem;color:var(--cold)}
.read p{margin:.5em 0}.read ul{margin:.4em 0;padding-left:1.2em}
.tag{display:inline-block;font-size:.72rem;font-weight:600;color:var(--cold);background:var(--cold-soft);border-radius:99px;padding:2px 9px;margin-right:6px}
.tag.m{color:var(--heat);background:var(--heat-soft)}
.qn{font-weight:600;color:var(--muted);font-size:.85rem}
.q{margin:6px 0 10px;font-size:1rem}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt b{color:var(--cold)}.opt:hover{border-color:var(--cold)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:10px;border-radius:12px;padding:10px 14px;font-size:.93rem}.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}.fb.info{background:var(--heat-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
input[type=text],select{font:inherit;font-size:1rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);min-width:0}
input[type=text]{flex:1;min-width:140px}
.pair{display:grid;grid-template-columns:1fr minmax(120px,48%);gap:8px;align-items:center;margin:6px 0}
.pair span{font-size:.95rem}
table.rub{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
table.rub th,table.rub td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.rub th{background:var(--cold-soft);font-weight:600}
table.rub td.c{text-align:center;width:64px}
details{margin-top:10px}summary{cursor:pointer;color:var(--cold);font-weight:600}
.hint{background:var(--heat-soft);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:.93rem}
.model{background:var(--ok-soft);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:.93rem}
.result{border-left:5px solid var(--heat)}
.lobar{display:grid;grid-template-columns:90px 1fr 60px;gap:8px;align-items:center;font-size:.88rem;margin:5px 0}
.lobar div{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.lobar i{display:block;height:100%;background:var(--cold)}
footer{border-top:1px solid var(--line);margin-top:30px;padding:14px 0 calc(24px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.8rem}
footer .brand{color:var(--cold);font-weight:600}
.done-note{font-size:.8rem;color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #F0B24A;outline-offset:2px}
[hidden]{display:none!important}
/* print */
body.print{background:#fff}body.print header{background:#fff;color:var(--ink);border-bottom:2px solid var(--ink);padding:10px 0}
body.print header .kick,body.print header .sub{color:var(--muted)}body.print header .brand{color:var(--heat)}
.pline{border-bottom:1px solid #9aa7b5;height:26px}
.pbox{border:1px solid #9aa7b5;border-radius:6px;height:90px;margin-top:6px}
.popt{margin:3px 0 3px 4px}
.key{color:var(--ok);font-weight:600}
@media print{.card{break-inside:avoid}h2{break-after:avoid}}
:root{--tier-accent:var(--cold)}.tier{display:grid;gap:8px;margin-top:10px}.tier>div{display:grid;grid-template-columns:2.4em 1fr auto;align-items:baseline;column-gap:6px}.tier>div>b{color:var(--tier-accent,inherit)}.tier .mk{white-space:nowrap;font-size:.85em;opacity:.75}.tier .tier{margin-top:4px;gap:4px}.tier .tier>div{grid-template-columns:2.2em 1fr auto}.stem{margin-bottom:2px}
</style></head><body>

const DATA={"topic": "ch8", "act": "tut", "topicTitle": "Application of Chromatographic Methods in Pharmaceutical Analysis", "pdf": "../../downloads/PHD125_CH8_Tutorial.pdf", "title": "Tutorial: exam-style practice", "sub": "Part A: 12 multiple-choice questions (1 mark each). Part B: 5 structured questions (38 marks). Same format as the final exam.", "how": "Part A marks itself. For Part B, write your full answer on paper first, then open <b>Worked solution and self-marking</b> and tick each marking step you earned. Use the hint only if you are stuck. Press <b>Finish</b> for your total out of 50.", "howPrint": "Answer Part A by circling one option. Answer Part B in full, showing your working.", "attrib": "Adapted from David Harvey, <i>Analytical Chemistry 2.1</i>, chapter 12, and <i>Instrumental Analysis</i> 28.6, LibreTexts, CC BY-NC-SA 4.0. TLC questions, drug questions and pharmacy scenarios are original material by Dr. NAM. Shared under CC BY-NC-SA for non-commercial teaching.", "next": "Next: play the Chapter 8 game, then Lab Practical 4 (TLC).", "sections": [{"h": "Part A · Multiple choice", "intro": "Choose one answer for each question.", "items": [{"type": "mcq", "label": "A1", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO1", "q": "In all forms of chromatography, separation depends on:", "opts": ["different distribution of components between two phases", "different colours of the components", "the mass of the column", "evaporation of the mobile phase"], "ans": 0, "why": "Harvey 12.1."}, {"type": "mcq", "label": "A2", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO1", "q": "In a chromatogram, the retention time is used mainly to:", "opts": ["help identify a component", "measure the amount", "calculate the pressure", "find the column length"], "ans": 0, "why": "Peak area measures amount."}, {"type": "mcq", "label": "A3", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO1", "q": "Separation by molecular size uses:", "opts": ["size-exclusion chromatography", "ion-exchange chromatography", "adsorption TLC", "gas–liquid chromatography"], "ans": 0, "why": "Porous gel; large molecules out first."}, {"type": "mcq", "label": "A4", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO2", "q": "Normal-phase chromatography uses:", "opts": ["a polar stationary phase and a less polar mobile phase", "a nonpolar stationary phase and a polar mobile phase", "a gas mobile phase", "a charged resin"], "ans": 0, "why": "Silica with, for example, hexane–ethyl acetate."}, {"type": "mcq", "label": "A5", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO2", "q": "On a silica TLC plate, all spots stay near the origin. The best change is to:", "opts": ["use a more polar solvent", "use a less polar solvent", "use a longer plate", "spray with ninhydrin"], "ans": 0, "why": "A more polar eluent moves spots further on silica."}, {"type": "mcq", "label": "A6", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO2", "q": "Which solvent has the highest polarity index?", "opts": ["acetonitrile", "toluene", "n-hexane", "diethyl ether"], "ans": 0, "why": "5.8, versus 2.4, 0.1 and 2.8."}, {"type": "mcq", "label": "A7", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO3", "q": "R<sub>f</sub> values always lie between:", "opts": ["0 and 1", "1 and 10", "−1 and 1", "0 and 100"], "ans": 0, "why": "The spot cannot pass the front."}, {"type": "mcq", "label": "A8", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO3", "q": "In paper chromatography, the stationary phase is:", "opts": ["water held in the cellulose", "the solvent", "silica gel", "air"], "ans": 0, "why": "Separation is mainly by partition."}, {"type": "mcq", "label": "A9", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO4", "q": "A strong base anion exchanger carries:", "opts": ["–N(CH<sub>3</sub>)<sub>3</sub><sup>+</sup>", "–SO<sub>3</sub><sup>−</sup>", "–COO<sup>−</sup>", "–OH only"], "ans": 0, "why": "Quaternary amine stays charged."}, {"type": "mcq", "label": "A10", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO4", "q": "Which detector is used in GC but not in HPLC?", "opts": ["flame ionisation detector", "UV/Vis detector", "refractive index detector", "fluorescence detector"], "ans": 0, "why": "The FID burns the gas stream."}, {"type": "mcq", "label": "A11", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO5", "q": "Residual solvents left from drug manufacture are measured by:", "opts": ["headspace GC", "paper chromatography", "ion exchange", "size exclusion"], "ans": 0, "why": "They are volatile."}, {"type": "mcq", "label": "A12", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO5", "q": "An internal standard is added in HPLC of blood samples to:", "opts": ["correct for losses during sample preparation and injection", "make the drug fluorescent", "increase the pressure", "remove proteins"], "ans": 0, "why": "Harvey 12.5 (fluoxetine)."}]}, {"h": "Part B · Structured questions", "intro": "Write your answers on paper, then self-mark with the worked solution.", "items": [{"type": "partb", "label": "B1", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO1", "marks": 7, "level": "C3", "q": "<div class=\"tier\"><div><b>(a)</b><span>Define chromatography and state the role of the stationary and mobile phases.</span><span class=\"mk\">(2 marks)</span></div><div><b>(b)</b><span>Explain why two components of a mixture leave a column at different times.</span><span class=\"mk\">(1 mark)</span></div><div><b>(c)</b><span>On an HPLC column, t<sub>m</sub> = 0.50 min. Peak A: t<sub>r</sub> = 3.50 min, w = 0.40 min. Peak B: t<sub>r</sub> = 4.10 min, w = 0.50 min. <div class=\"tier\"><div><b>(i)</b><span>Calculate the retention factor of each peak.</span><span></span></div><div><b>(ii)</b><span>Calculate the resolution and state whether the peaks are fully separated.</span><span></span></div></div></span><span class=\"mk\">(4 marks)</span></div></div>", "hint": "k = (t<sub>r</sub> − t<sub>m</sub>) ÷ t<sub>m</sub>; R = 2Δt<sub>r</sub> ÷ (w<sub>A</sub> + w<sub>B</sub>).", "work": "<div class=\"tier\"><div><b>(a)</b><span>Chromatography separates the components of a mixture as a mobile phase (liquid or gas) carries them over a stationary phase (solid, or a liquid film on a solid).</span><span></span></div><div><b>(b)</b><span>Each component distributes itself between the phases differently: the one held more strongly by the stationary phase moves more slowly.</span><span></span></div><div><b>(c)</b><span><div class=\"tier\"><div><b>(i)</b><span>k<sub>A</sub> = (3.50 − 0.50) ÷ 0.50 = <b>6.0</b>; k<sub>B</sub> = (4.10 − 0.50) ÷ 0.50 = <b>7.2</b>.</span><span></span></div><div><b>(ii)</b><span>R = 2(4.10 − 3.50) ÷ (0.40 + 0.50) = 1.20 ÷ 0.90 = <b>1.33</b>. This is below 1.5, so the peaks overlap slightly: not baseline separated.</span><span></span></div></div></span><span></span></div></div>", "rubric": [["Definition: separation of mixture components", 1], ["Roles of mobile and stationary phases", 1], ["Different distribution between phases", 1], ["k<sub>A</sub> = 6.0", 1], ["k<sub>B</sub> = 7.2", 1], ["R = 1.33", 1], ["Below 1.5: not fully separated", 1]]}, {"type": "partb", "label": "B2", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO2", "marks": 8, "level": "C3", "q": "<div class=\"tier\"><div><b>(a)</b><span>Distinguish between normal-phase and reversed-phase chromatography, giving one example of a stationary phase and a mobile phase for each.</span><span clas e (C18 bonded silica) with a polar mobile phase (water–methanol or water–acetonitrile); more polar compounds elute first.</span><span></span></div><div><b>(b)</b><span><b>Paracetamol</b> elutes first. It has a phenol –OH and an amide group and is more polar; ibuprofen has a large nonpolar hydrocarbon part and is held longer by the nonpolar C18.</span><span></span></div><div><b>(c)</b><span><div class=\"tier\"><div><b>(i)</b><span>P′ = 0.70(5.1) + 0.30(10.2) = 3.57 + 3.06 = <b>6.6</b>.</span><span></span></div><div><b>(ii)</b><span>50:50 has P′ = 7.65, a more polar (weaker) mobile phase in reversed phase, so compounds are held longer: retention times increase.</span><span></span></div></div></span><span></span></div><div><b>(d)</b><span>Isocratic: the mobile phase composition stays the same throughout. Gradient: the composition changes during the run (in reversed phase, from more water to more organic solvent), so late peaks come out sooner and sharper.</span><span></span></div></div>", "rubric": [["Normal phase described with example", 1], ["Reversed phase described with example", 1], ["Paracetamol elutes first", 1], ["Reason: more polar, less held by C18", 1], ["P′ = 6.6", 1], ["Retention times increase", 1], ["Isocratic defined", 1], ["Gradient defined", 1]]}, {"type": "partb", "label": "B3", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO3", "marks": 7, "level": "C3", "q": "<div class=\"stem\">A pharmacist tests a white powder labelled 'paracetamol'. A paracetamol standard (S) and the test sample (T) are run side by side on a silica gel F<sub>254</sub> plate.</div><div class=\"tier\"><div><b>(a)</b><span>Describe how the plate is prepared, developed and visualised.</span><span class=\"mk\">(3 marks)</span></div><div><b>(b)</b><span>The solvent front moved 8.0 cm. Spot S moved 3.2 cm. Sample T gave two spots, at 3.2 cm and 5.6 cm. Calculate the R<sub>f</sub> of each spot.</span><span class=\"mk\">(2 marks)</span></div><div><b>(c)</b><span>Interpret the result, and state how you would confirm the identity of the main spot.</span><span class=\"mk\">(2 marks)</span></div></div>", "hint": "R<sub>f</sub> = spot ÷ front. What does a second spot mean?", "work": "<div class=\"tier\"><div><b>(a)</b><span>Draw a pencil origin line about 1 cm from the bottom and apply small spots of S and T; let them dry. Place the plate in a closed, solvent-saturated tank with the solvent below the origin, and develop until the front is about 1 cm from the top. Remove, mark the front immediately, dry, and view under UV light at 254 nm: spots appear dark on a green background; circle them in pencil.</span><span></span></div><div><b>(b)</b><span>S: 3.2 ÷ 8.0 = <b>0.40</b>. T: 3.2 ÷ 8.0 = <b>0.40</b> and 5.6 ÷ 8.0 = <b>0.70</b>.</span><span></span></div><div><b>(c)</b><span>T contains a compound with the same R<sub>f</sub> as paracetamol, plus a second substance (an impurity or another drug), so it is not pure paracetamol. Confirm with a co-spot (S + T in one lane gives a single spot at 0.40) or by HPLC retention time or MS.</span><span></span></div></div>", "rubric": [["Pencil origin, small spots", 1], ["Closed saturated tank, solvent below origin; mark the front", 1], ["Visualise under UV 254 nm", 1], ["R<sub>f</sub>(S) = 0.40", 1], ["R<sub>f</sub> of T spots 0.40 and 0.70", 1], ["Contains paracetamol plus another substance", 1], ["Confirm by co-spot, HPLC or MS", 1]]}, {"type": "partb", "label": "B4", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO4", "marks": 8, "level": "C2", "q": "<div class=\"tier\"><div><b>(a)</b><span>Describe a cation exchanger and an anion exchanger, naming the functional group on a strong and a weak example of each.</span><span class=\"mk\">(3 marks)</span></div><div><b>(b)</b><span>Na<sup>+</sup>, Al<sup>3+</sup> and Ca<sup>2+</sup> are loaded on a cation-exchange column. State the order in which they are held, from most to least strongly, and explain how they can be washed off.</span><span class=\"mk\">(2 marks)</span></div><div><b>(c)</b><span>Name the four main parts of an HPLC instrument after the solvent reservoir, and state the job of any two.</span><span class=\"mk\">(2 marks)</span></div><div><b>(d)</b><span>Explain why ethanol in blood can be measured by GC but insulin cannot.</span><span class=\"mk\">(1 mark)</span></div></div>", "hint": "Higher charge, stronger hold. GC needs a sample that can become a vapour.", "work": "<div class=\"tier\"><div><b>(a)</b><span>A cation exchanger has fixed negative groups that hold and exchange cations: strong, –SO<sub>3</sub><sup>−</sup> (sulfonic acid); weak, –COO<sup>−</sup> (carboxylic acid). An anion exchanger has fixed positive groups that exchange anions: strong, –N(CH<sub>3</sub>)<sub>3</sub><sup>+</sup> (quaternary amine); weak, –NH<sub>3</sub><sup>+</sup> (amine). Both are usually polystyrene–divinylbenzene resins.</span><span></span></div><div><b>(b)</b><span>Al<sup>3+</sup> > Ca<sup>2+</sup> > Na<sup>+</sup> (higher charge is held more strongly). Elute by raising the concentration of a competing cation in the mobile phase (for example, more HCl or NaCl) or by changing the pH.</span><span></span></div><div><b>(c)</b><span>Pump (pushes the mobile phase through at high pressure, steady flow); injector (loop, delivers an exact sample volume); column (separates the components); detector (for example UV, produces a signal as each compound leaves).</span><span></span></div><div><b>(d)</b><span>Ethanol is volatile and stable when heated, so it can be vaporised; insulin is a large, non-volatile protein that would decompose in the hot injector.</span><span></span></div></div>", "rubric": [["Cation exchanger: negative fixed groups, exchanges cations", 1], ["Anion exchanger: positive fixed groups, exchanges anions", 1], ["Strong and weak groups named for both", 1], ["Al<sup>3+</sup> > Ca<sup>2+</sup> > Na<sup>+</sup>", 1], ["Elute with more competing ion or pH change", 1], ["Pump, injector, column, detector named", 1], ["Jobs of two parts", 1], ["Ethanol volatile; insulin non-volatile", 1]]}, {"type": "partb", "label": "B5", "topic": "Application of Chromatographic Methods in Pharmaceutical Analysis", "lo": "CH8-LO5", "marks": 8, "level": "C4", "q": "<div class=\"stem\">A regulator's lab suspects that a 'herbal' slimming capsule contains sibutramine.</div><div class=\"tier\"><div><b>(a)</b><span>Explain how TLC could be used as a quick screen.</span><span class=\"mk\">(2 marks)</span></div><div><b>(b)</b><span>The capsule contents are extracted and diluted 1 in 20. By HPLC, the calibration line is: peak area = 1200 + 5400 × C (C in mg/L). The diluted extract gives a peak area of 28 200. Calculate the sibutramine concentration in the diluted extract and in the original extract.</span><span class=\"mk\">(2 marks)</span></div><div><b>(c)</b><span>Suggest a method to measure traces of dichloromethane left in a capsule from manufacture, with a reason.</span><span class=\"mk\">(2 marks)</span></div><div><b>(d)</b><span>When measuring a drug in a patient's blood by HPLC, explain why <div class=\"tier\"><div><b>(i)</b><span>the sample is cleaned up first and</span><span></span></div><div><b>(ii)</b><span>an internal standard is added.</span><span></span></div></div></span><span class=\"mk\">(2 marks)</span></div></div>", "hint": "C = (area − intercept) ÷ slope, then multiply by the dilution factor.", "work": "<div class=\"tier\"><div><b>(a)</b><span>Spot the capsule extract and a sibutramine reference standard side by side (and a co-spot) on a silica plate, develop and visualise (UV 254 nm or a spray). A spot in the extract with the same R<sub>f</sub> and colour as the standard suggests sibutramine is present.</span><span></span></div><div><b>(b)</b><span>C = (28 200 − 1200) ÷ 5400 = 27 000 ÷ 5400 = <b>5.0 mg/L</b> in the diluted extract; × 20 = <b>100 mg/L</b> in the original extract.</span><span></span></div><div><b>(c)</b><span>Headspace <b>GC</b> (with FID or MS): dichloromethane is volatile, so it vaporises into the headspace and can be separated in the gas phase.</span><span></span></div><div><b>(d)</b><span><div class=\"tier\"><div><b>(i)</b><span>Blood proteins and other material would clog the column, bind to it and give interfering peaks, so they are removed (for example, by solid-phase extraction).</span><span></span></div><div><b>(ii)</b><span>The internal standard is carried through every step, so it corrects for small, variable losses during extraction and injection.</span><span></span></div></div></span><span></span></div></div>", "rubric": [["Extract and standard run on the same plate", 1], ["Same R<sub>f</sub> and colour → suggests sibutramine", 1], ["5.0 mg/L in diluted extract", 1], ["100 mg/L in original extract", 1], ["Headspace GC", 1], ["Reason: volatile", 1], ["Clean-up protects column, removes interferences", 1], ["Internal standard corrects for losses", 1]]}]}]};
const P=new URLSearchParams(location.search);const PRINT=P.has('print'),KEY=P.has('key');
const K='phd125:'+DATA.topic+':'+DATA.act;
const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let ST=LS.get(K+':state')||{a:{}};
const L=['A','B','C','D','E','F'];
const norm=(s,cs)=>{s=String(s).replace(/[₀-₉]/g,c=>'0123456789'['₀₁₂₃₄₅₆₇₈₉'.indexOf(c)]).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,' ').trim();s=s.replace(/\s*([+\-])\s*$/,'$1');return cs?s.replace(/ /g,''):s.toLowerCase().replace(/[.]$/,'')};
// flatten items
const ITEMS=[];DATA.sections.forEach((s,si)=>s.items.forEach((it,ii)=>{if(it.type!=='read'){it.id=si+'_'+ii;it.no=ITEMS.length+1;ITEMS.push(it)}}));
const maxOf=it=>it.type==='partb'?it.rubric.reduce((a,r)=>a+r[1],0):1;
const TOTAL=ITEMS.reduce((a,it)=>a+maxOf(it),0);
function save(){LS.set(K+':state',ST);const got=score();const answered=ITEMS.filter(it=>ST.a[it.id]&&ST.a[it.id].done).length;
 const p=LS.get(K)||{};p.total=TOTAL;p.t=Date.now();p.answered=answered;if(ST.finished&&answered===ITEMS.length){p.done=true;p.best=Math.max(p.best||0,got)}LS.set(K,p);
 LS.set('phd125:last',{topic:DATA.topic,act:DATA.act,t:Date.now()});bar()}
function score(){return ITEMS.reduce((a,it)=>{const s=ST.a[it.id];if(!s)return a;if(it.type==='partb')return a+(s.ticks||[]).reduce((x,t,i)=>x+(t?it.rubric[i][1]:0),0);return a+(s.ok?1:0)},0)}
function bar(){const done=ITEMS.filter(it=>ST.a[it.id]&&ST.a[it.id].done).length;const e=document.querySelector('.prog i');if(e)e.style.width=(100*done/ITEMS.length)+'%';const n=document.getElementById('cnt');if(n)n.textContent=done+' / '+ITEMS.length+' done'}
function head(){return `<header><div class="in">${PRINT?'':`<a class="home" href="../../#${DATA.topic}">⌂ Study hub</a>`}
<p class="kick">PHD125 Pharmaceutical Organic Chemistry · ${DATA.topicTitle}</p><h1>${DATA.title}</h1>
<p class="brand">Dr. NAM · Faculty of Pharmacy, UiTM Bertam, Penang</p><p class="sub">${DATA.sub}</p></div></header>`}
function tags(it){return `${it.topic?`<span class="tag">Topic: ${it.topic}</span>`:''}${it.lo?`<span class="tag">${it.lo}</span>`:''}${it.marks?`<span class="tag m">${it.marks} marks${it.level?', '+it.level:''}</span>`:''}`}
// ---------- interactive renderers
const R={
 read:it=>`<div class="card read">${it.h?`<h3>${it.h}</h3>`:''}${it.html}</div>`,
 mcq:it=>`<div class="opts">${it.opts.map((o,j)=>`<button class="opt" data-j="${j}"><b>${L[j]}</b><span>${o}</span></button>`).join('')}</div>`,
 tf:it=>`<div class="opts" style="grid-template-columns:1fr 1fr"><button class="opt" data-j="0"><b>T</b><span>True</span></button><button class="opt" data-j="1"><b>F</b><span>False</span></button></div>`,
 fill:it=>`${it.cs?'<p class="done-note" style="margin:2px 0 4px">Type formulas on one line: numbers become subscripts automatically (CO2 = CO₂, SO42- = SO₄²⁻).</p>':''}<div class="row"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${it.ph||'Type your answer'}"><button class="btn small chk">Check</button></div>`,
 num:it=>`<div class="row"><input type="text" inputmode="decimal" placeholder="number" style="max-width:180px">${it.unit?`<span>${it.unit}</span>`:''}<button class="btn small chk">Check</button></div>`,
 match:it=>`${it.left.map((l,i)=>`<div class="pair"><span>${l}</span><select data-i="${i}"><option value="">choose…</option>${it.right.map((r,j)=>`<option value="${j}">${r}</option>`).join('')}</select></div>`).join('')}<div class="row"><button class="btn small chk">Check</button></div>`,
 order:it=>`${it.items.map((l,i)=>`<div class="pair"><span>${l}</span><select data-i="${i}"><option value="">rank…</option>${it.items.map((_,j)=>`<option value="${j+1}">${j+1}${j==0?' ('+it.low+')':j==it.items.length-1?' ('+it.high+')':''}</option>`).join('')}</select></div>`).join('')}<div class="row"><button class="btn small chk">Check</button></div>`,
 self:it=>`<textarea rows="3" style="width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px" placeholder="Write your answer here (optional), then reveal the model answer."></textarea><div class="row"><button class="btn small ghost rev">Show model answer</button></div><div class="model" hidden>${it.model}<div class="row"><span>Did your answer match?</span><button class="btn small yes">Yes</button><button class="btn small ghost no">Not yet</button></div></div>`,
 partb:it=>`${it.hint?`<details><summary>Hint</summary><div class="hint">${it.hint}</div></details>`:''}<details class="sol"><summary>Worked solution and self-marking</summary><div class="model">${it.work||''}</div>
 <p class="done-note">Tick each row you earned. Your marks are added to your score.</p><table class="rub"><tr><th>Step</th><th>Marking criteria</th><th>Marks</th><th>Got it</th></tr>${it.rubric.map((r,i)=>`<tr><td class="c">${i+1}</td><td>${r[0]}</td><td class="c">${r[1]}</td><td class="c"><input type="checkbox" data-i="${i}" aria-label="Step ${i+1} earned"></td></tr>`).join('')}<tr><th></th><th>Total</th><th class="c">${maxOf(it)}</th><th class="c tk">0</th></tr></table></details>`
};
function qcard(it){if(it.type==='read')return R.read(it);
 return `<div class="card" id="q${it.id}"><span class="qn">${it.label?(it.type==='partb'?'Question ':'')+it.label:'Q'+it.no}</span> ${tags(it)}<div class="q">${it.q}</div>${R[it.type](it)}<div class="fbx"></div></div>`}
function fb(el,ok,it,extra){const x=el.querySelector('.fbx');x.innerHTML=`<div class="fb ${ok===null?'info':ok?'ok':'no'}">${ok===null?'':ok?'<b>Correct.</b> ':'<b>Not quite.</b> '}${extra||''}${it.why?' '+it.why:''}</div>`}
function mark(it,ok,val){ST.a[it.id]={done:true,ok,val};save()}
function restore(it,el){const s=ST.a[it.id];if(!s)return;
 if(it.type==='mcq'||it.type==='tf'){const a=it.type==='tf'?(it.ans?0:1):it.ans;el.querySelectorAll('.opt').forEach(b=>{const j=+b.dataset.j;if(j===a)b.classList.add('right');else if(j===s.val)b.classList.add('wrong')});fb(el,s.ok,it,s.ok?'':`Answer: <b>${it.type==='tf'?(it.ans?'True':'False'):L[a]}</b>.`)}
 else if(it.type==='fill'||it.type==='num'){el.querySelector('input').value=s.val||'';fb(el,s.ok,it,s.ok?'':`Answer: <b>${it.type==='num'?it.ans+(it.unit?' '+it.unit:''):it.show||it.acc[0]}</b>.`)}
 else if(it.type==='match'||it.type==='order'){el.querySelectorAll('select').forEach((sl,i)=>sl.value=(s.val||[])[i]??'');fb(el,s.ok,it,s.ok?'':'Correct: '+ansText(it)+'.')}
 else if(it.type==='self'){el.querySelector('textarea').value=s.val||'';el.querySelector('.model').hidden=false;fb(el,s.ok?true:null,it,s.ok?'Marked as matched.':'Marked as not yet. Review this and try again later.')}
 else if(it.type==='partb'){(s.ticks||[]).forEach((t,i)=>{const c=el.querySelector(`input[data-i="${i}"]`);if(c)c.checked=!!t});el.querySelector('.tk').textContent=(s.ticks||[]).reduce((x,t,i)=>x+(t?it.rubric[i][1]:0),0)}}
function ansText(it){if(it.type==='match')return it.left.map((l,i)=>`${l} → <b>${it.right[it.ans[i]]}</b>`).join('; ');if(it.type==='order'){const o=it.items.map((l,i)=>[it.ans[i],l]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);return o.join(' &lt; ')+` (${it.low} → ${it.high})`}return ''}
function wire(it,el){
 if(it.type==='mcq'||it.type==='tf')el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(ST.a[it.id])return;const j=+b.dataset.j;const a=it.type==='tf'?(it.ans?0:1):it.ans;mark(it,j===a,j);restore(it,el)});
 if(it.type==='fill')el.querySelector('.chk').onclick=()=>{const v=el.querySelector('input').value;if(!v.trim())return;const ok=it.acc.some(a=>norm(a,it.cs)===norm(v,it.cs));mark(it,ok,v);restore(it,el)};
 if(it.type==='num')el.querySelector('.chk').onclick=()=>{const v=el.querySelector('input').value;const x=parseFloat(v.replace(',','.'));if(isNaN(x))return;mark(it,Math.abs(x-it.ans)<=(it.tol||0.01),v);restore(it,el)};
 if(it.type==='match'||it.type==='order')el.querySelector('.chk').onclick=()=>{const v=[...el.querySelectorAll('select')].map(s=>s.value);if(v.some(x=>x===''))return;const ok=v.every((x,i)=>+x===it.ans[i]);mark(it,ok,v);restore(it,el)};
 if(it.type==='self'){el.querySelector('.rev').onclick=()=>{el.querySelector('.model').hidden=false};el.querySelector('.yes').onclick=()=>{mark(it,true,el.querySelector('textarea').value);restore(it,el)};el.querySelector('.no').onclick=()=>{mark(it,false,el.querySelector('textarea').value);restore(it,el)}}
 if(it.type==='partb')el.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{const t=[...el.querySelectorAll('input[type=checkbox]')].map(x=>x.checked);ST.a[it.id]={done:true,ticks:t};save();restore(it,el)});
}
function finish(){ST.finished=true;save();const got=score();const by={};ITEMS.forEach(it=>{const lo=it.lo||'—';by[lo]=by[lo]||[0,0];by[lo][1]+=maxOf(it);const s=ST.a[it.id];if(s)by[lo][0]+=it.type==='partb'?(s.ticks||[]).reduce((x,t,i)=>x+(t?it.rubric[i][1]:0),0):(s.ok?1:0)});
 const weak=Object.entries(by).filter(([k,v])=>v[0]/v[1]<0.7).map(([k])=>k);
 const r=document.getElementById('result');r.hidden=false;r.innerHTML=`<h3 style="margin:0 0 6px">Your score: ${got} / ${TOTAL} (${Math.round(100*got/TOTAL)}%)</h3>
 ${Object.entries(by).map(([k,v])=>`<div class="lobar"><span>${k}</span><div><i style="width:${100*v[0]/v[1]}%"></i></div><span>${v[0]}/${v[1]}</span></div>`).join('')}
 <p>${weak.length?`Revise: <b>${weak.join(', ')}</b>. The slides for these outcomes are in the study hub.`:'Well done. You are ready for the next step.'} ${DATA.next||''}</p>
 <p class="done-note">Your best score is saved on this device. You can reset and try again at any time.</p>`;r.scrollIntoView({behavior:'smooth'})}
function render(){document.body.classList.remove('print');
 document.getElementById('app').innerHTML=head()+`<div class="bar"><div class="in"><div class="prog"><i></i></div><span class="n" id="cnt"></span><span data-pt-slot=""></span><button class="btn small warn" id="reset">Reset</button></div></div>
<main><div class="in"><div class="card" style="border-left:5px solid var(--heat)"><p style="margin:0">${DATA.how}</p>${DATA.pdf?`<p style="margin:8px 0 0"><a href="${DATA.pdf}" download>Download the printable version (PDF, with answer key)</a></p>`:''}</div>
${DATA.sections.map(s=>`<h2>${s.h}</h2>${s.intro?`<p class="secintro">${s.intro}</p>`:''}${s.items.map(qcard).join('')}`).join('')}
<div class="row" style="margin-top:20px"><button class="btn" id="fin">Finish and see my score</button></div><div class="card result" id="result" hidden></div>
<footer><p class="brand">Dr. NAM · Faculty of Pharmacy, UiTM Bertam, Penang</p><p>Your answers are saved on this device only. Nothing is sent anywhere.</p><p>${DATA.attrib}</p></footer></div></main>`;
 ITEMS.forEach(it=>{const el=document.getElementById('q'+it.id);wire(it,el);restore(it,el)});bar();
 document.getElementById('fin').onclick=finish;
 document.getElementById('reset').onclick=()=>{if(!confirm('Clear all your answers for this activity and start again?'))return;ST={a:{}};LS.del(K+':state');const p=LS.get(K)||{};delete p.answered;LS.set(K,p);render();scrollTo(0,0)};
 if(ST.finished)finish();if(window.PT)PT.mount();}
// ---------- print renderer
function pq(it){const k=KEY;let body='';
 if(it.type==='read')return `<div class="card read">${it.h?`<h3>${it.h}</h3>`:''}${it.html}</div>`;
 if(it.type==='mcq')body=it.opts.map((o,j)=>`<div class="popt ${k&&j===it.ans?'key':''}">${L[j]}. ${o}</div>`).join('');
 else if(it.type==='tf')body=`<div class="popt">True / False ${k?`<span class="key">→ ${it.ans?'True':'False'}</span>`:''}</div>`;
 else if(it.type==='fill'||it.type==='num')body=k?`<div class="key">${it.type==='num'?it.ans+(it.unit?' '+it.unit:''):(it.show||it.acc[0])}</div>`:'<div class="pline"></div>';
 else if(it.type==='match'||it.type==='order'){body=it.type==='match'?`<p style="margin:4px 0;font-size:.9rem">Options: ${it.right.join(' · ')}</p>`+it.left.map(l=>`<div class="pair"><span>${l}</span><div class="pline"></div></div>`).join(''):`<p style="margin:4px 0;font-size:.9rem">Rank 1 (${it.low}) to ${it.items.length} (${it.high}): ${it.items.join(' · ')}</p><div class="pline"></div>`;if(k)body=`<div class="key">${ansText(it)}</div>`}
 else if(it.type==='self')body=k?`<div class="model">${it.model}</div>`:'<div class="pbox"></div>';
 else if(it.type==='partb')body=k?`${it.work?`<div class="model">${it.work}</div>`:''}<table class="rub"><tr><th>Step</th><th>Marking criteria</th><th>Marks</th></tr>${it.rubric.map((r,i)=>`<tr><td class="c">${i+1}</td><td>${r[0]}</td><td class="c">${r[1]}</td></tr>`).join('')}<tr><th></th><th>Total</th><th class="c">${maxOf(it)}</th></tr></table>`:'<div class="pbox" style="height:170px"></div>';
 const why=k&&it.why&&it.type!=='partb'?`<div style="font-size:.88rem;color:var(--muted);margin-top:4px">${it.why}</div>`:'';
 return `<div class="card"><span class="qn">${it.label?(it.type==='partb'?'Question ':'')+it.label:'Q'+it.no}</span> ${tags(it)}<div class="q">${it.q}</div>${body}${why}</div>`}
function renderPrint(){document.body.classList.add('print');
 document.getElementById('app').innerHTML=head()+`<main><div class="in">${KEY?'<h2 style="margin-top:6px">Answer key</h2>':`<div class="card"><p style="margin:0">${DATA.howPrint||DATA.how} The answer key is at the back.</p></div>`}
 ${DATA.sections.map(s=>{const its=KEY?s.items.filter(i=>i.type!=='read'):s.items;if(!its.length)return'';return `<h2>${s.h}</h2>${!KEY&&s.intro?`<p class="secintro">${s.intro}</p>`:''}${its.map(pq).join('')}`}).join('')}
 <footer><p class="brand">Dr. NAM · Faculty of Pharmacy, UiTM Bertam, Penang</p><p>${DATA.attrib}</p></footer></div></main>`}
PRINT?renderPrint():render();
</script></body></html>
